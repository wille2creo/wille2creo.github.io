url: https://wille2creo.github.io
title: 震之
description: >
  知其黑守其白
locale: zh-CN
lang: zh-CN
author: wille2creo

permalink: /:year/:month/:day/:title/

pagination:
  enabled: true
  per_page: 8
  permalink: /p/:num/
  sort_field: date
  sort_reverse: true
  title: ":title"
  trail:
    before: 2
    after: 2

markdown: kramdown
highlighter: rouge
search: true
future: true

exclude:
  - /wechat
  - /node_modules
  - package.json
  - package-lock.json
  - /.playwright-cli
  - AGENTS.md
  - ARTWORK.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/fonts/README.md
  - Makefile
  - /output
  - /script
  - /test
  - /vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      locale: zh-CN
      layout: single
      toc: true

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-sitemap
