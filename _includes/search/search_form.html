{% assign locale = include.locale | default: site.locale %}
{% assign labels = site.data.ui-text[locale] %}
<div class="search-content__inner-wrap">
  <form class="search-content__form" role="search">
    <label class="sr-only" for="search">{{ labels.search_label_text }}</label>
    <input type="search" id="search" class="search-input"
      placeholder="{{ labels.search_placeholder_text }}"
      data-index="{{ '/assets/search.json' | relative_url }}"
      data-locale="{{ locale }}" data-loading="{{ labels.search_loading }}"
      data-error="{{ labels.search_error }}"
      data-count="{{ labels.search_count }}" autocomplete="off">
  </form>
  <p id="search-status" class="results__found" role="status"
    aria-live="polite" aria-atomic="true"></p>
  <div id="results" class="results"></div>
</div>
