name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: .ruby-version

      - name: Install dependencies
        run: make install

      - name: Build site
        run: make build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: .ruby-version
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: |
          make install
          npm ci --ignore-scripts
      - name: Build and check site and publisher contracts
        run: make check
      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser interactions and responsive layouts
        run: npm run test:browser
        env:
          BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-artifacts
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, validate]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
